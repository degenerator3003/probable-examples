
services:
  cpu_bench:
    image: bench-sysbench 
    container_name: bench_cpu
    restart: "no"
    volumes:
      - ./bench-results:/results
    command: >
      bash -lc "sysbench cpu --threads=4 --time=20 run
      | tee /results/cpu_sysbench.txt"

  mem_bench:
    image: bench-sysbench 
    container_name: bench_mem
    restart: "no"
    volumes:
      - ./bench-results:/results
    command: >
      bash -lc "sysbench memory --threads=4 --time=20 run
      | tee /results/memory_sysbench.txt"

  disk_bench:
    image: bench-sysbench 
    container_name: bench_disk
    restart: "no"
    volumes:
      - ./bench-results:/results
    command: >
      bash -lc "dd if=/dev/zero of=/results/testfile.bin bs=4M count=512 conv=fdatasync
      2> /results/disk_dd.txt"

